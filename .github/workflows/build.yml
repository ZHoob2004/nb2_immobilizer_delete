name: Build ATtiny85 firmware

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr

      - name: Build firmware
        run: |
          mkdir -p dist

          avr-gcc \
            -Wall -Wextra -Os -std=gnu11 \
            -ffunction-sections -fdata-sections \
            -Wl,--gc-sections \
            -DF_CPU=1000000UL \
            -mmcu=attiny85 \
            -o dist/mx5-immobilizer-bypass.elf \
            main.c

          avr-objcopy \
            -j .text -j .data \
            -O ihex \
            dist/mx5-immobilizer-bypass.elf \
            dist/mx5-immobilizer-bypass.hex

          avr-objcopy \
            -j .text -j .data \
            -O binary \
            dist/mx5-immobilizer-bypass.elf \
            dist/mx5-immobilizer-bypass.bin

          avr-size -C --mcu=attiny85 dist/mx5-immobilizer-bypass.elf

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mx5-immobilizer-bypass-${{ github.sha }}
          path: |
            dist/mx5-immobilizer-bypass.hex
            dist/mx5-immobilizer-bypass.bin
          if-no-files-found: error

      - name: Create GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/mx5-immobilizer-bypass.hex \
            dist/mx5-immobilizer-bypass.bin \
            --verify-tag \
            --generate-notes

